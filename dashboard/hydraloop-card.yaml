# Hydraloop card for Home Assistant (picture-elements).
# Requires the HACS frontend cards button-card and fluid-level-background-card.
# Replace every 'yourserial' with your Hydraloop serial in lower case (e.g. ha12345678),
# and copy dashboard/hydraloop.png (or your own transparent PNG) to config/www/hydraloop.png.
type: picture-elements
image: data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3C/svg%3E
style: |
  ha-card {
    background-color: #1a1f24 !important;
    border-radius: 16px;
    overflow: hidden;
  }
elements:
- type: image
  image: /local/hydraloop.png
  style:
    top: 50%
    left: 18%
    height: 92%
    width: 40%
    transform: translate(-50%, -50%)
    pointer-events: none
- type: custom:button-card
  entity: binary_sensor.hydraloop_yourserial_online
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: more-info
  hold_action:
    action: none
  style:
    top: 3.5%
    left: 31%
    width: 11%
    transform: translate(-50%, 0%)
  styles:
    card:
    - background-color: rgba(30, 38, 45, 0.85)
    - border-radius: 999px
    - border: 1px solid rgba(255, 255, 255, 0.12)
    - padding: '0'
    - height: auto
    - aspect-ratio: 3.2 / 1
    - container-type: inline-size
    grid:
    - grid-template-areas: '"status"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
    - align-items: center
  custom_fields:
    status: |
      [[[
        let state = entity ? entity.state : 'unknown';
        let label = state === 'on' ? 'Online' : state === 'off' ? 'Offline' : 'Unknown';
        let color = state === 'on' ? '#4caf50' : state === 'off' ? '#ff5252' : '#9e9e9e';
        return `<div style="display: flex; justify-content: center; align-items: center; gap: 6cqw; height: 100%; color: white; font-family: sans-serif; font-weight: bold; font-size: clamp(6.5px, 15cqw, 30px); white-space: nowrap;"><span style="width: 1em; height: 1em; min-width: 1em; border-radius: 50%; background-color: ${color}; display: inline-block; box-shadow: 0 0 0.4em ${color};"></span>${label}</div>`;
      ]]]
- type: custom:button-card
  entity: binary_sensor.hydraloop_yourserial_online
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  hold_action:
    action: none
  style:
    top: 3.5%
    left: 10%
    width: 16%
    transform: translate(-50%, 0%)
  styles:
    card:
    - background-color: rgba(30, 38, 45, 0.85)
    - border-radius: 10px
    - border: 1px solid rgba(255, 255, 255, 0.12)
    - padding: 3% 5%
    - height: auto
    - aspect-ratio: 2.3 / 1
    - container-type: inline-size
    grid:
    - grid-template-areas: '"details"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
    - align-items: center
  custom_fields:
    details: |
      [[[
        let reg = hass.entities && hass.entities[entity.entity_id];
        let dev = (reg && hass.devices && hass.devices[reg.device_id]) || {};
        let line = (text, size, tint, weight) => text ? `<span style="display: block; white-space: nowrap; font-size: ${size}; color: ${tint}; font-weight: ${weight}; margin-top: 2%;">${text}</span>` : '';
        let versions = [dev.sw_version && `FW ${dev.sw_version}`, dev.hw_version && `HW ${dev.hw_version}`].filter(Boolean).join(' · ');
        return `<div style="font-family: sans-serif; text-align: left; line-height: 1.15;">${line(dev.model, 'clamp(5.5px, 10.5cqw, 26px)', 'white', 'bold')}${line(dev.serial_number && `SN ${dev.serial_number}`, 'clamp(5px, 9cqw, 22px)', '#b0bec5', 'normal')}${line(versions, 'clamp(5px, 9cqw, 22px)', '#b0bec5', 'normal')}</div>`;
      ]]]
- type: custom:button-card
  style:
    top: 4%
    left: 51%
    width: 28%
    transform: translate(-50%, 0%)
  styles:
    card:
    - background-color: rgba(30, 38, 45, 0.85)
    - border-radius: 12px
    - border: 1px solid rgba(255, 255, 255, 0.12)
    - padding: 4%
    - height: auto
    - aspect-ratio: 1.8 / 1
    - container-type: inline-size
    grid:
    - grid-template-areas: '"tank info"'
    - grid-template-columns: 24% 72%
    - align-items: center
    - column-gap: 4%
    custom_fields:
      tank:
      - pointer-events: none
  custom_fields:
    tank:
      card:
        type: custom:fluid-level-background-card
        entity: sensor.hydraloop_collected_water
        full_value: 100
        wave_style: realistic-performance
        mask_image: tank
        mask_size: contain
        level_color:
        - 0
        - 180
        - 255
        - 0.9
        background_color:
        - 45
        - 55
        - 65
        - 0.5
        card:
          type: custom:button-card
          color_type: blank-card
          styles:
            card:
            - height: 100%
            - aspect-ratio: 1 / 2
            - background-color: transparent
            - border: none
            - box-shadow: none
    info: |
      [[[
        let stateObj = states['sensor.hydraloop_collected_water'];
        let pct = stateObj ? parseFloat(stateObj.state) : 0;
        let liters = states['sensor.hydraloop_yourserial_collected_water_volume'] ? states['sensor.hydraloop_yourserial_collected_water_volume'].state : '--';
        return `
          <div style="display: flex; flex-direction: column; justify-content: center; height: 100%; width: 100%;">
            <div style="color: white; font-family: sans-serif; text-align: left; line-height: 1.1;">
              <span style="font-size: clamp(8px, 8.6cqw, 40px); font-weight: bold; display: block; white-space: nowrap;">Collected Water</span>
              <span style="font-size: clamp(5.5px, 6.5cqw, 30px); color: #b0bec5; display: block; white-space: nowrap;">Fluid level</span>
              <span style="font-size: clamp(11px, 12cqw, 52px); font-weight: bold; display: block; color: white; margin: 2% 0;">${isNaN(pct) ? '--' : pct.toFixed(1)}%</span>
              <span style="font-size: clamp(7px, 6.5cqw, 30px); color: #e0e0e0; display: block; white-space: nowrap;">${liters} L</span>
            </div>
          </div>
        `;
      ]]]
  entity: sensor.hydraloop_collected_water
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: more-info
  hold_action:
    action: none
- type: custom:button-card
  style:
    top: 4%
    left: 81%
    width: 28%
