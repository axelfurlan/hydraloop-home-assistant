- type: custom:button-card
  entity: sensor.hydraloop_yourserial_water_recycled_total
  style:
    top: 80.2%
    left: 66%
    width: 58%
    transform: translate(-50%, 0%)
  styles:
    card:
    - background-color: rgba(30, 38, 45, 0.85)
    - border-radius: 12px
    - border: 1px solid rgba(255, 255, 255, 0.12)
    - padding: 1.93%
    - height: auto
    - aspect-ratio: 6.21 / 1
    - container-type: inline-size
    grid:
    - grid-template-areas: '"icon info since"'
    - grid-template-columns: 10.6% 44.4% 45%
    - align-items: center
    name:
    - display: none
  custom_fields:
    icon: |
      <div style="display: flex; justify-content: center; align-items: center; height: 100%;"><ha-icon icon="mdi:sigma" style="color: #00b4ff; --mdc-icon-size: clamp(14px, 7.8cqw, 64px);"></ha-icon></div>
    info: |
      [[[
        let val = states['sensor.hydraloop_yourserial_water_recycled_total'].state;
        let unit = states['sensor.hydraloop_yourserial_water_recycled_total'].attributes.unit_of_measurement || 'L';
        return `<div style="color: white; font-family: sans-serif; text-align: left; line-height: 1.1;"><span style="font-size: clamp(6.5px, 3.3cqw, 28px); font-weight: bold; display: block; white-space: nowrap;">Total</span><span style="font-size: clamp(4.5px, 2.4cqw, 20px); color: #b0bec5; display: block; white-space: nowrap;">Lifetime total</span><span style="font-size: clamp(8px, 4.2cqw, 36px); font-weight: bold; display: block; color: white; margin-top: 1%;">${val} ${unit}</span></div>`;
      ]]]
    since: |
      [[[
        let s = states['sensor.hydraloop_yourserial_commissioned'];
        let start = s ? new Date(s.state) : null;
        if (!start || isNaN(start)) return '';
        let now = new Date();
        let months = (now.getFullYear() - start.getFullYear()) * 12 + now.getMonth() - start.getMonth();
        if (now.getDate() < start.getDate()) months--;
        let y = Math.floor(months / 12), m = months % 12, parts = [];
        if (y) parts.push(y + (y === 1 ? ' year' : ' years'));
        if (m) parts.push(m + (m === 1 ? ' month' : ' months'));
        let when = start.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
        return `<div style="color: white; font-family: sans-serif; text-align: right; line-height: 1.2; padding-right: 3%;"><span style="font-size: clamp(6.5px, 3.3cqw, 28px); font-weight: bold; display: block; white-space: nowrap;">Since ${when}</span><span style="font-size: clamp(5px, 2.8cqw, 24px); color: #b0bec5; display: block; white-space: nowrap; margin-top: 2%;">${parts.join(', ')}</span></div>`;
      ]]]
- type: conditional
  conditions:
  - entity: binary_sensor.hydraloop_yourserial_problem
    state: 'on'
  elements:
  - type: custom:button-card
    entity: binary_sensor.hydraloop_yourserial_problem
    style:
      top: 72%
      left: 18%
      width: 28%
      transform: translate(-50%, 0%)
    styles:
      card:
      - background-color: rgba(30, 38, 45, 0.85)
      - border-radius: 12px
      - border: 1px solid rgba(255, 255, 255, 0.12)
      - padding: 4%
      - height: auto
      - aspect-ratio: 3 / 1
      - container-type: inline-size
      grid:
      - grid-template-areas: '"icon info"'
      - grid-template-columns: 22% 78%
      - align-items: center
      name:
      - display: none
    custom_fields:
      icon: |
        <div style="display: flex; justify-content: center; align-items: center; height: 100%;"><ha-icon icon="mdi:alert-circle" style="color: #ff5252; --mdc-icon-size: clamp(14px, 17cqw, 64px);"></ha-icon></div>
      info: |
        [[[
          let s = states['binary_sensor.hydraloop_yourserial_problem'];
          let list = (s && s.attributes.issues) || [];
          let first = list[0] || {};
          let title = first.code ? `Fault ${first.code}` : 'Hydraloop Fault';
          let detail = first.issue ? first.issue.replace(/_/g, ' ') : 'See HDM for details';
          let level = (first.severity || 'fault').toUpperCase();
          if (list.length > 1) level += ` +${list.length - 1}`;
          return `<div style="color: white; font-family: sans-serif; text-align: left; line-height: 1.1; min-width: 0; overflow: hidden;"><span style="font-size: clamp(6.5px, 7.2cqw, 28px); font-weight: bold; display: block; white-space: nowrap;">${title}</span><span style="font-size: clamp(4.5px, 5.2cqw, 20px); color: #b0bec5; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${detail}</span><span style="font-size: clamp(8px, 9.2cqw, 36px); font-weight: bold; display: block; color: #ff5252; margin-top: 1%;">${level}</span></div>`;
        ]]]
    tap_action:
      action: more-info
grid_options:
  columns: 24
  rows: auto
