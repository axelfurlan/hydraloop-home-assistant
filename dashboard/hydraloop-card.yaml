      ]]]
    info: |
      [[[
        let state = states['switch.hydraloop_yourserial_bypass'].state;
        return `<div style="color: white; font-family: sans-serif; text-align: left; line-height: 1.1;"><span style="font-size: clamp(6.5px, 7.2cqw, 28px); font-weight: bold; display: block; white-space: nowrap;">Bypass Mode</span><span style="font-size: clamp(4.5px, 5.2cqw, 20px); color: #b0bec5; display: block; white-space: nowrap;">Hold to unlock</span><span style="font-size: clamp(8px, 9.2cqw, 36px); font-weight: bold; display: block; color: white; margin-top: 1%;">${state.toUpperCase()}</span></div>`;
      ]]]
  tap_action:
    action: toggle
  lock:
    enabled: true
    unlock: hold
    duration: 5
